[package]
name = "dar-presence"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Presence registry for agent dashboard discovery"
rust-version = "1.83"
publish = false

[lib]
name = "dar_presence"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
