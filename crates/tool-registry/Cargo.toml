[package]
name = "tool-registry"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"

[dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.43", features = ["rt", "sync", "macros"] }

[dev-dependencies]
tokio = { version = "1.43", features = ["rt", "sync", "macros", "rt-multi-thread"] }
