[package]
name = "dar-tool-registry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Host-side extension tool registry for dar agent extensions"
rust-version = "1.83"

[lib]
name = "tool_registry"

[dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = "0.18"
tokio = { version = "1.43", features = ["rt", "sync", "macros"] }

[dev-dependencies]
tokio = { version = "1.43", features = ["rt", "sync", "macros", "rt-multi-thread"] }
