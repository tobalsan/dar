[package]
name = "dar-extension-sdk"
version = "0.6.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Public SDK for writing third-party dar extensions"
rust-version = "1.83"

[lib]
name = "dar_extension_sdk"

[dependencies]
anyhow = "1"
cap-chat = { package = "dar-cap-chat", path = "../cap-chat", version = "0.6" }
cap-deliver = { package = "dar-cap-deliver", path = "../cap-deliver", version = "0.6" }
dar-artifacts = { path = "../artifacts", version = "0.6" }
host-api = { package = "dar-host-api", path = "../host-api", version = "0.6" }
orchestrator-api = { package = "dar-orchestrator-api", path = "../orchestrator-api", version = "0.6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tool-registry = { package = "dar-tool-registry", path = "../tool-registry", version = "0.6" }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.43", features = ["sync"] }
