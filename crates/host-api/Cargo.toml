[package]
name = "dar-host-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Host API traits and types for dar agent extensions"
rust-version = "1.83"

[lib]
name = "host_api"

[dependencies]
anyhow = "1"
axum = "0.8"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.43", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
