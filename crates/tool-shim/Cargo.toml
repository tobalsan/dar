[package]
name = "tool-shim"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"

# Runner-agnostic shim transport: the portable reliability floor that advertises
# the host `ToolRegistry` to an agent via a strict prompt convention + tool-call
# marker, parses the marker out of agent output, dispatches through the SAME
# registry the native MCP bridge uses, and feeds the structured result back as a
# continuation prompt. Used where native MCP is unavailable/unreliable.

[dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tool-registry = { path = "../tool-registry" }

[dev-dependencies]
tokio = { version = "1.43", features = ["rt", "rt-multi-thread", "macros", "io-util"] }
agentropy-cli = { path = "../agentropy-cli" }
