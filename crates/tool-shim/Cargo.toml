[package]
name = "dar-tool-shim"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Runner-agnostic shim transport for exposing host tools when native MCP is unavailable"
rust-version = "1.83"

# Runner-agnostic shim transport: the portable reliability floor that advertises
# the host `ToolRegistry` to an agent via a strict prompt convention + tool-call
# marker, parses the marker out of agent output, dispatches through the SAME
# registry the native MCP bridge uses, and feeds the structured result back as a
# continuation prompt. Used where native MCP is unavailable/unreliable.

[lib]
name = "tool_shim"

[dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tool-registry = { package = "dar-tool-registry", path = "../tool-registry", version = "0.2" }

[dev-dependencies]
tokio = { version = "1.43", features = ["rt", "rt-multi-thread", "macros", "io-util"] }
dar-cli-core = { path = "../dar-cli" }
