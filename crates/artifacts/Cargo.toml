[package]
name = "dar-artifacts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Immutable, verified artifact vault for DAR"
rust-version = "1.83"

[lib]
name = "dar_artifacts"

[dependencies]
fs2 = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
