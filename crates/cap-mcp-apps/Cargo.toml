[package]
name = "dar-cap-mcp-apps"
version = "0.6.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP Apps host capability contract"

[lib]
name = "cap_mcp_apps"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
