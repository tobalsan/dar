[package]
name = "dar-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent extension host: boots extensions, manages terminal, HTTP registry"
rust-version = "1.83"
publish = false

[lib]
name = "dar_host"

[dependencies]
anyhow = "1"
axum = "0.8"
host-api = { package = "dar-host-api", path = "../host-api", version = "0.4" }
agent-env = { package = "dar-agent-env", path = "../agent-env", version = "0.4" }
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "signal", "sync"] }
crossterm = "0.28"
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
