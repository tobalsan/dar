[package]
name = "agentropy-cli"
version = "0.2.2"
edition = "2021"
rust-version = "1.83"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "signal", "io-std", "io-util"] }
host-api = { path = "../host-api" }
agentropy-host = { path = "../agentropy-host" }
agentropy-presence = { path = "../agentropy-presence" }
cap-runner = { path = "../cap-runner" }
tool-registry = { path = "../tool-registry" }
orchestrator = { path = "../../extensions/orchestrator" }

[dev-dependencies]
tempfile = "3"
