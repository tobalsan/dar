[package]
name = "agentropy-cli"
version = "0.2.1"
edition = "2021"
rust-version = "1.83"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "signal"] }
host-api = { path = "../host-api" }
agentropy-host = { path = "../agentropy-host" }
cap-runner = { path = "../cap-runner" }
orchestrator = { path = "../../extensions/orchestrator" }
tracker-files = { path = "../../extensions/tracker-files" }
tracker-linear = { path = "../../extensions/tracker-linear" }
runner-pi = { path = "../../extensions/runner-pi" }
runner-claude = { path = "../../extensions/runner-claude" }
runner-codex = { path = "../../extensions/runner-codex" }
runner-cli = { path = "../../extensions/runner-cli" }
runner-fake = { path = "../../extensions/runner-fake" }
runner-opencode = { path = "../../extensions/runner-opencode" }

[dev-dependencies]
tempfile = "3"
