[package]
name = "agentropy-cli"
version = "0.2.1"
edition = "2021"
rust-version = "1.83"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "signal"] }
host-api = { path = "../host-api" }
agentropy-host = { path = "../agentropy-host" }
cap-runner = { path = "../cap-runner" }
orchestrator = { path = "../../extensions/orchestrator" }

[dev-dependencies]
tempfile = "3"
