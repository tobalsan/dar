[package]
name = "dar-cap-tracker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Issue tracker capability contract for dar extensions"
rust-version = "1.83"
publish = false

[lib]
name = "cap_tracker"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
minijinja = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
