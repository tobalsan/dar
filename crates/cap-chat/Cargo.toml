[package]
name = "dar-cap-chat"
version = "0.6.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Chat capability contract for interactive operator chat sessions"
rust-version = "1.83"

[lib]
name = "cap_chat"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1.43", features = ["macros", "rt"] }

[dependencies]
anyhow = "1"
cap-runner = { package = "dar-cap-runner", path = "../cap-runner", version = "0.4" }
dar-artifacts = { path = "../artifacts", version = "0.4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.43", features = ["sync", "rt"] }
tracing = "0.1"
