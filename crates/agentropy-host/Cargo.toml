[package]
name = "agentropy-host"
version = "0.2.0"
edition = "2021"
rust-version = "1.83"

[dependencies]
anyhow = "1"
axum = "0.8"
host-api = { path = "../host-api" }
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "signal", "sync"] }
crossterm = "0.28"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
