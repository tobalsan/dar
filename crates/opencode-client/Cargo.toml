[package]
name = "opencode-client"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
runner-core = { path = "../runner-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.43", features = ["io-util", "net", "process", "time"] }

[dev-dependencies]
axum = "0.7"
tempfile = "3"
