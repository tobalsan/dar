[package]
name = "runner-core"
version = "0.2.0"
edition = "2021"
rust-version = "1.83"

[dependencies]
anyhow = "1"
cap-runner = { path = "../cap-runner" }
host-api = { path = "../host-api" }
tool-registry = { path = "../tool-registry" }
chrono = { version = "0.4", features = ["serde"] }
nix = { version = "0.29", features = ["signal", "process"] }
serde_json = "1"
tokio = { version = "1.43", features = ["process", "signal", "sync", "time", "io-util", "rt"] }
tracing = "0.1"

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"
