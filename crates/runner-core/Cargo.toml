[package]
name = "dar-runner-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared runner utilities: process spawning, protocol parsing, MCP bridge helpers"
rust-version = "1.83"
publish = false

[lib]
name = "runner_core"

[dependencies]
anyhow = "1"
cap-runner = { package = "dar-cap-runner", path = "../cap-runner", version = "0.3" }
host-api = { package = "dar-host-api", path = "../host-api", version = "0.3" }
tool-registry = { package = "dar-tool-registry", path = "../tool-registry", version = "0.3" }
chrono = { version = "0.4", features = ["serde"] }
nix = { version = "0.29", features = ["signal", "process"] }
serde_json = "1"
tokio = { version = "1.43", features = ["process", "signal", "sync", "time", "io-util", "rt"] }
tracing = "0.1"

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"
