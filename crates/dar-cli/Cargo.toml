[package]
name = "dar-cli-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reusable CLI boot wiring for the dar agent host"
rust-version = "1.83"
publish = false

[lib]
name = "dar_cli_core"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
regex = "1"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
semver = "1"
toml = "0.8"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "signal", "io-std", "io-util", "time"] }
host-api = { package = "dar-host-api", path = "../host-api", version = "0.6" }
agent-env = { package = "dar-agent-env", path = "../agent-env", version = "0.6" }
dar-host = { path = "../dar-host", version = "0.6" }
dar-presence = { path = "../dar-presence", version = "0.6" }
cap-runner = { package = "dar-cap-runner", path = "../cap-runner", version = "0.6" }
tool-registry = { package = "dar-tool-registry", path = "../tool-registry", version = "0.6" }
orchestrator = { package = "dar-orchestrator", path = "../../extensions/orchestrator", version = "0.6" }
system-context = { package = "dar-system-context", path = "../../extensions/system-context", version = "0.6" }
scheduler = { package = "dar-scheduler", path = "../../extensions/scheduler", version = "0.6" }
mcp = { package = "dar-mcp", path = "../../extensions/mcp", version = "0.6" }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
