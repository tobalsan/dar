[package]
name = "chat-codex"
version = "0.2.1"
edition = "2021"
rust-version = "1.83"

[dependencies]
anyhow = "1"
cap-chat = { path = "../../crates/cap-chat" }
host-api = { path = "../../crates/host-api" }
runner-core = { path = "../../crates/runner-core" }
serde_json = "1"
tokio = { version = "1.43", features = ["io-util", "process", "rt", "sync", "time"] }

[dev-dependencies]
nix = { version = "0.29", features = ["signal", "process"] }
tempfile = "3"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread"] }
