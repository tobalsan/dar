[package]
name = "orchestrator"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"

[dependencies]
anyhow = "1"
cap-runner = { path = "../../crates/cap-runner" }
cap-tracker = { path = "../../crates/cap-tracker" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
host-api = { path = "../../crates/host-api" }
orchestrator-api = { path = "../../crates/orchestrator-api" }
runner-core = { path = "../../crates/runner-core" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
minijinja = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "process", "signal", "sync", "time", "io-util", "net"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
nix = { version = "0.29", features = ["signal", "process"] }

[dev-dependencies]
tempfile = "3"
