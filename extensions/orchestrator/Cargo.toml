[package]
name = "dar-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Orchestration loop extension: drives agent runs from tracker issues"
rust-version = "1.83"
publish = false

[lib]
name = "orchestrator"

[dependencies]
anyhow = "1"
async-trait = "0.1"
cap-runner = { package = "dar-cap-runner", path = "../../crates/cap-runner", version = "0.3" }
cap-tracker = { package = "dar-cap-tracker", path = "../../crates/cap-tracker", version = "0.3" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
host-api = { package = "dar-host-api", path = "../../crates/host-api", version = "0.3" }
tool-registry = { package = "dar-tool-registry", path = "../../crates/tool-registry", version = "0.3" }
orchestrator-api = { package = "dar-orchestrator-api", path = "../../crates/orchestrator-api", version = "0.3" }
runner-core = { package = "dar-runner-core", path = "../../crates/runner-core", version = "0.3" }
extension-sdk = { package = "dar-extension-sdk", path = "../../crates/extension-sdk", version = "0.3" }
system-files = { package = "dar-system-files", path = "../../crates/system-files", version = "0.3" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
minijinja = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "process", "signal", "sync", "time", "io-util", "net"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
nix = { version = "0.29", features = ["signal", "process"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
tracker-files = { package = "dar-tracker-files", path = "../tracker-files" }
tracker-linear = { package = "dar-tracker-linear", path = "../tracker-linear" }
runner-pi = { package = "dar-runner-pi", path = "../runner-pi" }
runner-codex = { package = "dar-runner-codex", path = "../runner-codex" }
runner-cli = { package = "dar-runner-cli", path = "../runner-cli" }
runner-fake = { package = "dar-runner-fake", path = "../runner-fake" }
