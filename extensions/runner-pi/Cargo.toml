[package]
name = "dar-runner-pi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pi runner extension: drives pi --mode rpc for agent runs"
rust-version = "1.83"
publish = false

[lib]
name = "runner_pi"

[dependencies]
anyhow = "1"
cap-runner = { package = "dar-cap-runner", path = "../../crates/cap-runner", version = "0.3" }
chrono = { version = "0.4", features = ["serde"] }
host-api = { package = "dar-host-api", path = "../../crates/host-api", version = "0.3" }
runner-core = { package = "dar-runner-core", path = "../../crates/runner-core", version = "0.3" }
serde_json = "1"
tokio = { version = "1.43", features = ["process", "sync", "time", "io-util", "rt", "fs"] }

[dev-dependencies]
chrono = { version = "0.4", features = ["serde"] }
nix = { version = "0.29", features = ["signal", "process"] }
tempfile = "3"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread"] }
