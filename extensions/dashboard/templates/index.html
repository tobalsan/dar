<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dar - {{ content.agent.id }}</title>
  <script src="/assets/htmx.min.js"></script>
  <style>
    :root {
      --bg: #111317; --panel: #1b1f26; --panel-2: #202630; --border: #303844;
      --fg: #eceff3; --muted: #9ba6b5; --accent: #62b3b0; --ok: #57c785;
      --warn: #f2b84b; --bad: #f26d6d; --info: #7aa2f7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    button {
      border: 1px solid var(--border); background: var(--panel-2); color: var(--fg);
      border-radius: 6px; padding: .45rem .7rem; font: inherit; cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.danger:hover { border-color: var(--bad); color: var(--bad); }
    header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); background: #15181d; }
    .top { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; }
    h1 { font-size: 1.05rem; margin: 0 .4rem 0 0; }
    .stat { color: var(--muted); padding: .2rem .45rem; border: 1px solid var(--border); border-radius: 6px; }
    .stat strong { color: var(--fg); font-weight: 700; }
    .spacer { flex: 1; }
    .folder { color: var(--muted); margin-top: .55rem; word-break: break-all; }
    .runner { margin-top: .4rem; display: flex; align-items: center; gap: .45rem; font-size: .85rem; }
    .runner-pill { background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px; padding: .1rem .55rem; color: var(--accent); font-weight: 600; }
    .runner-model { color: var(--muted); }
    main { padding: 1rem 1.25rem; }
    main.runs-grid { display: grid; grid-template-columns: minmax(18rem, .8fr) 1.2fr; gap: 1rem; }
    section { min-width: 0; }
    h2 { font-size: .76rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 .65rem; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: .9rem; }
    .stack { display: grid; gap: 1rem; align-content: start; }
    .empty { color: var(--muted); font-style: italic; margin: .3rem 0; }
    .run-list { display: grid; gap: .45rem; }
    .run-row {
      width: 100%; text-align: left; display: grid; grid-template-columns: 1fr auto; gap: .35rem .75rem;
      padding: .6rem; background: #171b21; border: 1px solid var(--border); border-radius: 6px;
    }
    .run-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta { color: var(--muted); font-size: .78rem; overflow-wrap: anywhere; }
    .pill { border-radius: 999px; padding: .12rem .45rem; font-size: .72rem; font-weight: 700; }
    .completed { background: rgba(87,199,133,.15); color: var(--ok); }
    .failed { background: rgba(242,109,109,.15); color: var(--bad); }
    .interrupted { background: rgba(242,184,75,.15); color: var(--warn); }
    .other { background: rgba(155,166,181,.15); color: var(--muted); }
    .live { background: rgba(122,162,247,.15); color: var(--info); }
    .run-row.clickable { cursor: pointer; }
    .run-row.clickable:hover { border-color: var(--accent); }
    .pager { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .75rem; justify-content: center; }
    .page-btn { min-width: 2rem; padding: .3rem .5rem; font-size: .8rem; }
    .page-btn.current { border-color: var(--accent); color: var(--accent); font-weight: 700; }
    .page-btn:disabled { opacity: .4; cursor: default; }
    .page-btn:disabled:hover { border-color: var(--border); }
    #run-detail:empty { display: none; }
    .drawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: min(34rem, 100%);
      background: var(--panel); border-left: 1px solid var(--border);
      box-shadow: -8px 0 24px rgba(0,0,0,.45); padding: 1rem 1.1rem;
      display: flex; flex-direction: column; gap: .8rem; overflow: hidden; z-index: 50;
    }
    .drawer-head { display: flex; align-items: center; gap: .6rem; }
    .drawer-head h2 { margin: 0; }
    .drawer-close { margin-left: auto; }
    .drawer-meta { display: grid; gap: .3rem; }
    .kv { display: grid; grid-template-columns: 7rem 1fr; gap: .5rem; }
    .kv .k { color: var(--muted); text-transform: uppercase; font-size: .68rem; letter-spacing: .06em; padding-top: .1rem; }
    .kv .v { overflow-wrap: anywhere; }
    .drawer-events-head { display: flex; align-items: center; gap: .5rem; margin: .2rem 0 0; }
    .drawer-events { flex: 1; overflow-y: auto; overflow-x: hidden; display: grid; grid-template-columns: minmax(0, 1fr); gap: .3rem; align-content: start; padding-right: .25rem; }
    .ev-row {
      display: grid; grid-template-columns: auto 1fr; gap: .5rem; align-items: baseline;
      padding: .35rem .5rem; background: #171b21; border: 1px solid var(--border); border-radius: 5px;
    }
    .ev-meta { display: flex; flex-direction: column; gap: .1rem; }
    .ev-ts { color: var(--muted); font-size: .68rem; white-space: nowrap; }
    .ev-tag { color: var(--accent); font-size: .68rem; white-space: nowrap; }
    .ev-text { overflow-wrap: anywhere; white-space: pre-wrap; }
    * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
    ::-webkit-scrollbar-track { background: transparent; }
    .dash-tabs {
      display: flex; gap: .35rem; padding: .55rem 1.25rem 0;
      border-bottom: 1px solid var(--border); background: #15181d;
    }
    .dash-tab {
      border: 1px solid var(--border); border-bottom: none; background: var(--panel-2);
      color: var(--muted); border-radius: 6px 6px 0 0; padding: .4rem .8rem;
      font: inherit; cursor: pointer;
    }
    .dash-tab:hover { color: var(--fg); border-color: var(--accent); }
    .dash-tab.active { color: var(--fg); background: var(--panel); border-color: var(--accent); }
    @media (max-width: 760px) {
      header, main { padding-left: .8rem; padding-right: .8rem; }
      main.runs-grid { grid-template-columns: 1fr; }
      .drawer { width: 100%; }
      .dash-tabs { padding-left: .8rem; padding-right: .8rem; flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  {% if !tabs.is_empty() %}
  <nav class="dash-tabs" id="dash-tabs" aria-label="Dashboard tabs">
    <button class="dash-tab active" data-tab-url="/content"
            onclick="activateDashTab(this,'/content')">Runs</button>
    {% for t in tabs %}
    <button class="dash-tab" data-tab-url="/tabs/{{ t.id }}"
            onclick="activateDashTab(this,'/tabs/{{ t.id }}')">{{ t.title }}</button>
    {% endfor %}
  </nav>
  {% endif %}
  <div id="content" hx-get="/content" hx-trigger="every 2s" hx-swap="innerHTML">
    {{ content|safe }}
  </div>
  <div id="run-detail"></div>
  <script>
    window.__dashPage = window.__dashPage || 1;
    // Active tab URL the #content poller re-fetches. Defaults to the
    // orchestrator run view so a dashboard with zero registered tabs behaves
    // exactly as before.
    window.__dashTab = window.__dashTab || '/content';
    document.body.addEventListener('htmx:configRequest', function (ev) {
      var path = ev.detail.path || '';
      // Only the run view carries pagination page-state.
      if (path.indexOf('/content') === 0) {
        ev.detail.parameters['page'] = window.__dashPage;
      }
    });
    // Switch the active tab: repoint the #content poller at the tab's fragment
    // URL and load it immediately. Preserves the htmx innerHTML-swap of
    // #content (no <body> swap); the run view stays the default tab.
    function activateDashTab(btn, url) {
      window.__dashTab = url;
      var nav = document.getElementById('dash-tabs');
      if (nav) {
        nav.querySelectorAll('.dash-tab').forEach(function (b) { b.classList.remove('active'); });
      }
      btn.classList.add('active');
      var content = document.getElementById('content');
      content.setAttribute('hx-get', url);
      htmx.process(content);
      htmx.ajax('GET', url, { target: '#content', swap: 'innerHTML' });
    }
    function closeDrawer() {
      document.getElementById('run-detail').innerHTML = '';
    }
    document.addEventListener('click', function(ev) {
      var drawer = document.getElementById('run-detail');
      if (!drawer.firstElementChild) return;
      if (ev.target.closest('#run-detail')) return;
      if (ev.target.closest('[hx-target="#run-detail"]')) return;
      closeDrawer();
    });
    document.addEventListener('keydown', function(ev) {
      if (ev.key === 'Escape' && document.getElementById('run-detail').firstElementChild) {
        closeDrawer();
      }
    });
  </script>
</body>
</html>
