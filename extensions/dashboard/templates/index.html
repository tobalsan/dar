<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dar - {{ content.agent.id }}</title>
  <script src="{{ prefix }}/assets/htmx.min.js"></script>
  <script>
    // ORDERING INVARIANT: this script must stay here, in <head>, before any
    // fragment JS runs. A passive_default tab's fragment (e.g. chat) is
    // inlined straight into #content below, above the bottom-of-body script;
    // its inline JS (EventSource) must observe __dashPrefix and the patched
    // fetch/EventSource already installed, or it connects unprefixed.
    window.__dashPrefix = "{{ prefix }}";
    (function () {
      var prefix = window.__dashPrefix;
      if (!prefix) return; // direct access: native fetch/EventSource untouched
      function prefixed(url) {
        if (typeof url !== 'string') return url;
        // not root-absolute, or protocol-relative ("//host/...") -> leave alone
        if (url.indexOf('/') !== 0 || url.indexOf('//') === 0) return url;
        if (url.indexOf(prefix + '/') === 0) return url; // already prefixed
        return prefix + url;
      }
      var nativeFetch = window.fetch;
      window.fetch = function (input, init) {
        return nativeFetch.call(this, typeof input === 'string' ? prefixed(input) : input, init);
      };
      var NativeEventSource = window.EventSource;
      window.EventSource = function (url, opts) {
        return new NativeEventSource(prefixed(url), opts);
      };
      window.EventSource.prototype = NativeEventSource.prototype;
    })();
  </script>
  <script>
    // Theme: choice (light|dark|system) lives in localStorage 'dar-theme';
    // the resolved light|dark lands on <html data-theme>. Runs in <head> so the
    // first paint is already themed; the body script wires the toggle to it.
    window.__darTheme = (function () {
      var mq = matchMedia('(prefers-color-scheme: dark)');
      function choice() {
        var v = null;
        try { v = localStorage.getItem('dar-theme'); } catch (e) {}
        return v === 'light' || v === 'dark' ? v : 'system';
      }
      function apply() {
        var c = choice();
        document.documentElement.dataset.theme = c === 'system' ? (mq.matches ? 'dark' : 'light') : c;
        return c;
      }
      function set(c) {
        try { localStorage.setItem('dar-theme', c); } catch (e) {}
        return apply();
      }
      mq.addEventListener('change', function () { if (choice() === 'system') apply(); });
      apply();
      return { choice: choice, apply: apply, set: set };
    })();
  </script>
  <style>
    :root {
      --bg: #111317; --panel: #1b1f26; --panel-2: #202630; --border: #303844;
      --fg: #eceff3; --muted: #9ba6b5; --accent: #62b3b0; --ok: #57c785;
      --warn: #f2b84b; --bad: #f26d6d; --info: #7aa2f7;
      --chrome: #15181d; --row: #171b21; --shadow: rgba(0,0,0,.45);
    }
    [data-theme="light"] {
      --bg: #f7f8fa; --panel: #ffffff; --panel-2: #eef1f5; --border: #d8dde5;
      --fg: #18202a; --muted: #667184; --accent: #287f7c; --ok: #278653;
      --warn: #a66a08; --bad: #c13f3f; --info: #3f68bd;
      --chrome: #ffffff; --row: #f7f8fa; --shadow: rgba(24,32,42,.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    button {
      border: 1px solid var(--border); background: var(--panel-2); color: var(--fg);
      border-radius: 6px; padding: .45rem .7rem; font: inherit; cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.danger:hover { border-color: var(--bad); color: var(--bad); }
    header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); background: var(--chrome); }
    .top { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; }
    h1 { font-size: 1.05rem; margin: 0 .4rem 0 0; }
    .stat { color: var(--muted); padding: .2rem .45rem; border: 1px solid var(--border); border-radius: 6px; }
    .stat strong { color: var(--fg); font-weight: 700; }
    .spacer { flex: 1; }
    .folder { color: var(--muted); margin-top: .55rem; word-break: break-all; }
    .runner { margin-top: .4rem; display: flex; align-items: center; gap: .45rem; font-size: .85rem; }
    .runner-pill { background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px; padding: .1rem .55rem; color: var(--accent); font-weight: 600; }
    .runner-model { color: var(--muted); }
    main { padding: 1rem 1.25rem; }
    main.runs-grid { display: grid; grid-template-columns: minmax(18rem, .8fr) 1.2fr; gap: 1rem; }
    section { min-width: 0; }
    h2 { font-size: .76rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 .65rem; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: .9rem; }
    .stack { display: grid; gap: 1rem; align-content: start; }
    .empty { color: var(--muted); font-style: italic; margin: .3rem 0; }
    .run-list { display: grid; gap: .45rem; }
    .run-row {
      width: 100%; text-align: left; display: grid; grid-template-columns: 1fr auto; gap: .35rem .75rem;
      padding: .6rem; background: var(--row); border: 1px solid var(--border); border-radius: 6px;
    }
    .run-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta { color: var(--muted); font-size: .78rem; overflow-wrap: anywhere; }
    .pill { border-radius: 999px; padding: .12rem .45rem; font-size: .72rem; font-weight: 700; }
    .completed { background: rgba(87,199,133,.15); color: var(--ok); }
    .failed { background: rgba(242,109,109,.15); color: var(--bad); }
    .interrupted { background: rgba(242,184,75,.15); color: var(--warn); }
    .other { background: rgba(155,166,181,.15); color: var(--muted); }
    .live { background: rgba(122,162,247,.15); color: var(--info); }
    .run-row.clickable { cursor: pointer; }
    .run-row.clickable:hover { border-color: var(--accent); }
    .pager { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .75rem; justify-content: center; }
    .page-btn { min-width: 2rem; padding: .3rem .5rem; font-size: .8rem; }
    .page-btn.current { border-color: var(--accent); color: var(--accent); font-weight: 700; }
    .page-btn:disabled { opacity: .4; cursor: default; }
    .page-btn:disabled:hover { border-color: var(--border); }
    #run-detail:empty { display: none; }
    .drawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: min(34rem, 100%);
      background: var(--panel); border-left: 1px solid var(--border);
      box-shadow: -8px 0 24px var(--shadow); padding: 1rem 1.1rem;
      display: flex; flex-direction: column; gap: .8rem; overflow: hidden; z-index: 50;
    }
    .drawer-head { display: flex; align-items: center; gap: .6rem; }
    .drawer-head h2 { margin: 0; }
    .drawer-close { margin-left: auto; }
    .drawer-meta { display: grid; gap: .3rem; }
    .kv { display: grid; grid-template-columns: 7rem 1fr; gap: .5rem; }
    .kv .k { color: var(--muted); text-transform: uppercase; font-size: .68rem; letter-spacing: .06em; padding-top: .1rem; }
    .kv .v { overflow-wrap: anywhere; }
    .drawer-events-head { display: flex; align-items: center; gap: .5rem; margin: .2rem 0 0; }
    .drawer-events { flex: 1; overflow-y: auto; overflow-x: hidden; display: grid; grid-template-columns: minmax(0, 1fr); gap: .3rem; align-content: start; padding-right: .25rem; }
    .ev-row {
      display: grid; grid-template-columns: auto 1fr; gap: .5rem; align-items: baseline;
      padding: .35rem .5rem; background: var(--row); border: 1px solid var(--border); border-radius: 5px;
    }
    .ev-meta { display: flex; flex-direction: column; gap: .1rem; }
    .ev-ts { color: var(--muted); font-size: .68rem; white-space: nowrap; }
    .ev-tag { color: var(--accent); font-size: .68rem; white-space: nowrap; }
    .ev-text { overflow-wrap: anywhere; white-space: pre-wrap; }
    * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
    ::-webkit-scrollbar-track { background: transparent; }
    .dash-tabs {
      display: flex; align-items: flex-end; gap: .15rem; padding: 0 1.25rem; min-height: 2.9rem;
      border-bottom: 1px solid var(--border); background: var(--chrome);
    }
    .dash-tab {
      border: none; background: var(--panel-2); color: var(--muted);
      border-radius: 8px 8px 0 0; padding: .5rem .9rem; margin-bottom: -1px;
      font: inherit; cursor: pointer;
    }
    .dash-tab:hover { color: var(--fg); }
    .dash-tab.active { color: var(--fg); background: var(--bg); }
    .sound-toggle {
      margin-left: auto; align-self: center; width: 2rem; height: 2rem; padding: 0; border: none;
      border-radius: 999px; background: transparent; color: var(--muted);
      display: inline-flex; align-items: center; justify-content: center;
    }
    .sound-toggle:hover { background: var(--panel-2); color: var(--fg); }
    .theme-seg {
      margin-left: .75rem; align-self: center; display: inline-flex; gap: 2px; padding: 3px;
      border-radius: 999px; background: var(--panel-2);
    }
    .theme-seg button {
      width: 1.8rem; height: 1.6rem; padding: 0; border: none; border-radius: 999px;
      background: transparent; color: var(--muted); display: inline-grid; place-items: center;
    }
    .theme-seg button:hover { color: var(--fg); }
    .theme-seg button[aria-checked="true"] { background: var(--bg); color: var(--accent); box-shadow: 0 1px 3px var(--shadow); }
    .theme-seg svg { width: 14px; height: 14px; }
    @media (max-width: 760px) {
      header, main { padding-left: .8rem; padding-right: .8rem; }
      main.runs-grid { grid-template-columns: 1fr; }
      .drawer { width: 100%; }
      .dash-tabs { padding-left: .8rem; padding-right: 1rem; flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  {% if !tabs.is_empty() %}
  <nav class="dash-tabs" id="dash-tabs" aria-label="Dashboard tabs">
    {% if show_runs %}
    <button class="dash-tab{% if active_tab == "content" %} active{% endif %}" data-tab-url="/content" data-self-refreshing="false"
            onclick="activateDashTab(this,'/content')">Runs</button>
    {% endif %}
    {% for t in tabs %}
    <button class="dash-tab{% if active_tab == t.id %} active{% endif %}" data-tab-url="/tabs/{{ t.id }}" data-self-refreshing="{{ t.self_refreshing }}"
            onclick="activateDashTab(this,'/tabs/{{ t.id }}')">{{ t.title }}</button>
    {% endfor %}
    <button type="button" class="sound-toggle" id="sound-toggle" aria-pressed="true" aria-label="Notification sound on" title="Notification sound"><span id="sound-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/></svg></span></button>
    <div class="theme-seg" id="theme-toggle" role="radiogroup" aria-label="Theme">
      <button type="button" role="radio" data-theme-choice="light" aria-checked="false" aria-label="Light" title="Light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button type="button" role="radio" data-theme-choice="dark" aria-checked="false" aria-label="Dark" title="Dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
      <button type="button" role="radio" data-theme-choice="system" aria-checked="false" aria-label="System" title="System"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
    </div>
  </nav>
  {% endif %}
  <div id="content">
    {% match initial_fragment %}
    {% when Some with (f) %}{{ f|safe }}
    {% when None %}{{ content|safe }}
    {% endmatch %}
  </div>
  <div id="run-detail"></div>
  <script>
    window.__dashPage = window.__dashPage || 1;
    (function () {
      var group = document.getElementById('theme-toggle');
      if (!group) return;
      var radios = group.querySelectorAll('[role="radio"]');
      function paint(choice) {
        radios.forEach(function (r) {
          var on = r.dataset.themeChoice === choice;
          r.setAttribute('aria-checked', String(on));
          r.tabIndex = on ? 0 : -1; // ARIA radio pattern: one tab stop, arrows move within the group
        });
      }
      radios.forEach(function (r, i) {
        r.addEventListener('click', function () { paint(window.__darTheme.set(r.dataset.themeChoice)); });
        r.addEventListener('keydown', function (e) {
          var step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
          var to = e.key === 'Home' ? 0 : e.key === 'End' ? radios.length - 1 : step ? (i + step + radios.length) % radios.length : -1;
          if (to < 0) return;
          e.preventDefault();
          radios[to].focus();
          paint(window.__darTheme.set(radios[to].dataset.themeChoice));
        });
      });
      window.addEventListener('storage', function (e) { if (e.key === 'dar-theme') paint(window.__darTheme.apply()); });
      paint(window.__darTheme.choice());
    })();
    (function () {
      var BELL = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/>';
      var button = document.getElementById('sound-toggle');
      var icon = document.getElementById('sound-icon');
      if (!button) return;
      function on() { try { return localStorage.getItem('dar-notify-sound') !== 'off'; } catch (e) { return true; } }
      function paint() {
        var enabled = on();
        button.setAttribute('aria-pressed', String(enabled));
        button.setAttribute('aria-label', enabled ? 'Notification sound on' : 'Notification sound off');
        icon.innerHTML = BELL + (enabled ? '' : '<path d="M3 3l18 18"/>') + '</svg>';
      }
      button.addEventListener('click', function () {
        try { localStorage.setItem('dar-notify-sound', on() ? 'off' : 'on'); } catch (e) {}
        paint();
      });
      window.addEventListener('storage', function (e) { if (e.key === 'dar-notify-sound') paint(); });
      paint();
    })();
    // Agent-wide turn notifications (sound + unread dots) run from the shell so
    // they survive tab switches. A 404 (no chat extension) is harmless.
    (function () {
      var script = document.createElement('script');
      script.src = (window.__dashPrefix || '') + '/chat/notify.js';
      document.body.appendChild(script);
    })();
    // Active tab URL/liveness the #content poller reads. Initialized from the
    // server-rendered active tab button so a page load lands on whatever tab
    // was chosen (Runs, or a passive-default tab); falls back to the run view
    // when there is no tab nav at all.
    (function () {
      var activeBtn = document.querySelector('.dash-tab.active');
      window.__dashTab = activeBtn ? activeBtn.dataset.tabUrl : '/content';
      window.__dashTabLive = activeBtn ? activeBtn.dataset.selfRefreshing === 'true' : false;
    })();
    document.body.addEventListener('htmx:configRequest', function (ev) {
      var path = ev.detail.path || '';
      // Only the run view carries pagination page-state. Must match the
      // unprefixed path, so this runs before the prefix is prepended below.
      if (path.indexOf('/content') === 0) {
        ev.detail.parameters['page'] = window.__dashPage;
      }
      var prefix = window.__dashPrefix;
      if (prefix && path.indexOf('/') === 0 && path.indexOf(prefix + '/') !== 0) {
        ev.detail.path = prefix + path;
      }
    });
    // Switch the active tab: repoint the poller at the tab's fragment URL and
    // load it immediately. Preserves the innerHTML-swap of #content (no
    // <body> swap); a self-refreshing tab suspends the poller entirely so its
    // own live DOM/JS is never torn down.
    function activateDashTab(btn, url) {
      window.__dashTab = url;
      window.__dashTabLive = btn.dataset.selfRefreshing === 'true';
      var nav = document.getElementById('dash-tabs');
      if (nav) {
        nav.querySelectorAll('.dash-tab').forEach(function (b) { b.classList.remove('active'); });
      }
      btn.classList.add('active');
      htmx.ajax('GET', url, { target: '#content', swap: 'innerHTML' });
    }
    // #content used to self-poll declaratively every 2s, which tore down and
    // recreated any self-refreshing tab's DOM/JS every tick. This timer
    // re-fetches the active tab's fragment on the same cadence, but skips the
    // fetch entirely while __dashTabLive is true.
    setInterval(function () {
      if (!window.__dashTabLive) {
        htmx.ajax('GET', window.__dashTab, { target: '#content', swap: 'innerHTML' });
      }
    }, 2000);
    function closeDrawer() {
      document.getElementById('run-detail').innerHTML = '';
    }
    document.addEventListener('click', function(ev) {
      var drawer = document.getElementById('run-detail');
      if (!drawer.firstElementChild) return;
      if (ev.target.closest('#run-detail')) return;
      if (ev.target.closest('[hx-target="#run-detail"]')) return;
      closeDrawer();
    });
    document.addEventListener('keydown', function(ev) {
      if (ev.key === 'Escape' && document.getElementById('run-detail').firstElementChild) {
        closeDrawer();
      }
    });
  </script>
</body>
</html>
