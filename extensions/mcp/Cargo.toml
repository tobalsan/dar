[package]
name = "dar-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "mcp"

[dependencies]
anyhow = "1"
async-trait = "0.1"
dar-extension-sdk = { path = "../../crates/extension-sdk", version = "0.5" }
futures-util = "0.3"
fs2 = "0.4"
http = "1"
libc = "0.2"
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "auth", "reqwest"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1.43", features = ["io-util", "net", "process", "time"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
axum = "0.8"
dar-host-api = { path = "../../crates/host-api" }
dar-tool-registry = { path = "../../crates/tool-registry" }
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "sync"] }
