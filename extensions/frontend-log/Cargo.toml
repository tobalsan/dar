[package]
name = "frontend-log"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"

[dependencies]
anyhow = "1"
host-api = { path = "../../crates/host-api" }
tokio = { version = "1.43", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "time"] }
