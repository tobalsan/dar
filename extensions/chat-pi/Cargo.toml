[package]
name = "dar-chat-pi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pi chat backend for the dar TUI chat interface"
rust-version = "1.83"
publish = false

[lib]
name = "chat_pi"

[dependencies]
anyhow = "1"
cap-chat = { package = "dar-cap-chat", path = "../../crates/cap-chat", version = "0.4" }
host-api = { package = "dar-host-api", path = "../../crates/host-api", version = "0.4" }
runner-core = { package = "dar-runner-core", path = "../../crates/runner-core", version = "0.4" }
serde_json = "1"
tokio = { version = "1.43", features = ["io-util", "process", "rt", "sync", "time"] }

[dev-dependencies]
dar-extension-sdk = { path = "../../crates/extension-sdk", version = "0.4" }
orchestrator-api = { package = "dar-orchestrator-api", path = "../../crates/orchestrator-api", version = "0.4" }
nix = { version = "0.29", features = ["signal", "process"] }
tempfile = "3"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread"] }
