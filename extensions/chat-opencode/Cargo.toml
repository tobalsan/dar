[package]
name = "chat-opencode"
version = "0.2.0"
edition = "2021"
rust-version = "1.83"

[dependencies]
anyhow = "1"
cap-chat = { path = "../../crates/cap-chat" }
host-api = { path = "../../crates/host-api" }
opencode-client = { path = "../../crates/opencode-client" }
runner-core = { path = "../../crates/runner-core" }
serde_json = "1"
tokio = { version = "1.43", features = ["rt", "sync", "time"] }

[dev-dependencies]
nix = { version = "0.29", features = ["signal"] }
tempfile = "3"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread"] }
