[package]
name = "dar-chat-opencode"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "OpenCode chat backend for the dar TUI chat interface"
rust-version = "1.83"

[lib]
name = "chat_opencode"

[dependencies]
anyhow = "1"
cap-chat = { package = "dar-cap-chat", path = "../../crates/cap-chat", version = "0.2" }
host-api = { package = "dar-host-api", path = "../../crates/host-api", version = "0.2" }
opencode-client = { package = "dar-opencode-client", path = "../../crates/opencode-client", version = "0.2" }
runner-core = { package = "dar-runner-core", path = "../../crates/runner-core", version = "0.2" }
serde_json = "1"
tokio = { version = "1.43", features = ["rt", "sync", "time"] }

[dev-dependencies]
nix = { version = "0.29", features = ["signal"] }
tempfile = "3"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread"] }
