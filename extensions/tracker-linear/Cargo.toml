[package]
name = "tracker-linear"
version = "0.2.0"
edition = "2021"
rust-version = "1.83"

[dependencies]
anyhow = "1"
cap-tracker = { path = "../../crates/cap-tracker" }
chrono = { version = "0.4", features = ["serde"] }
host-api = { path = "../../crates/host-api" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1.43", features = ["rt-multi-thread", "time", "macros", "net", "io-util"] }
tool-registry = { path = "../../crates/tool-registry" }
tracing = "0.1"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
