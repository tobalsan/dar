[package]
name = "dar-scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Scheduler extension: fires agent runs on cron schedules from jobs.json"
rust-version = "1.83"
publish = false

[lib]
name = "scheduler"

[package.metadata.dar]
factory = "scheduler::extension"

[dependencies]
anyhow = "1"
axum = "0.8"
host-api = { package = "dar-host-api", path = "../../crates/host-api", version = "0.4" }
cap-runner = { package = "dar-cap-runner", path = "../../crates/cap-runner", version = "0.4" }
cap-dashboard-tab = { package = "dar-cap-dashboard-tab", path = "../../crates/cap-dashboard-tab", version = "0.4" }
cap-deliver = { package = "dar-cap-deliver", path = "../../crates/cap-deliver", version = "0.4" }
runner-core = { package = "dar-runner-core", path = "../../crates/runner-core", version = "0.4" }
system-context = { package = "dar-system-context", path = "../system-context", version = "0.4" }
tool-registry = { package = "dar-tool-registry", path = "../../crates/tool-registry", version = "0.4" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock", "serde"] }
chrono-tz = "0.10"
croner = "3"
nix = { version = "0.29", features = ["signal", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1.43", features = ["io-util", "macros", "rt", "sync", "time", "process"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
dashboard = { package = "dar-dashboard", path = "../dashboard" }
tool-registry-host = { package = "dar-tool-registry-host", path = "../tool-registry-host" }
axum = "0.8"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
