[package]
name = "scheduler"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"

[package.metadata.agentropy]
factory = "scheduler::extension"

[dependencies]
anyhow = "1"
axum = "0.8"
host-api = { path = "../../crates/host-api" }
cap-runner = { path = "../../crates/cap-runner" }
cap-dashboard-tab = { path = "../../crates/cap-dashboard-tab" }
runner-core = { path = "../../crates/runner-core" }
tool-registry = { path = "../../crates/tool-registry" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock", "serde"] }
chrono-tz = "0.10"
croner = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1.43", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
dashboard = { path = "../dashboard" }
tool-registry-host = { path = "../tool-registry-host" }
axum = "0.8"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
