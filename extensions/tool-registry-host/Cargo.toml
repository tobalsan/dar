[package]
name = "dar-tool-registry-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Host tool-registry extension: publishes the shared ToolRegistry as a service"
rust-version = "1.83"
publish = false

[lib]
name = "tool_registry_host"

[dependencies]
anyhow = "1"
async-trait = "0.1"
dar-artifacts = { path = "../../crates/artifacts", version = "0.3" }
host-api = { package = "dar-host-api", path = "../../crates/host-api", version = "0.3" }
tool-registry = { package = "dar-tool-registry", path = "../../crates/tool-registry", version = "0.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread"] }
