[package]
name = "dar-runner-opencode"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "OpenCode runner extension: drives opencode serve for agent runs"
publish = false

[lib]
name = "runner_opencode"

[dependencies]
anyhow = "1"
cap-runner = { package = "dar-cap-runner", path = "../../crates/cap-runner", version = "0.4" }
chrono = "0.4"
host-api = { package = "dar-host-api", path = "../../crates/host-api", version = "0.4" }
opencode-client = { package = "dar-opencode-client", path = "../../crates/opencode-client", version = "0.4" }
runner-core = { package = "dar-runner-core", path = "../../crates/runner-core", version = "0.4" }
serde_json = "1"
tokio = { version = "1.43", features = ["process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
nix = { version = "0.29", features = ["signal"] }
