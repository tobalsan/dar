[package]
name = "runner-opencode"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
cap-runner = { path = "../../crates/cap-runner" }
chrono = "0.4"
host-api = { path = "../../crates/host-api" }
opencode-client = { path = "../../crates/opencode-client" }
runner-core = { path = "../../crates/runner-core" }
serde_json = "1"
tokio = { version = "1.43", features = ["process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
nix = { version = "0.29", features = ["signal"] }
