[package]
name = "dar-tracker-files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "File-backed issue tracker extension for dar"
rust-version = "1.83"
publish = false

[lib]
name = "tracker_files"

[dependencies]
anyhow = "1"
cap-tracker = { package = "dar-cap-tracker", path = "../../crates/cap-tracker", version = "0.4" }
chrono = { version = "0.4", features = ["serde"] }
host-api = { package = "dar-host-api", path = "../../crates/host-api", version = "0.4" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
