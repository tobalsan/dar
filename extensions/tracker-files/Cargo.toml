[package]
name = "tracker-files"
version = "0.2.0"
edition = "2021"
rust-version = "1.83"

[dependencies]
anyhow = "1"
cap-tracker = { path = "../../crates/cap-tracker" }
chrono = { version = "0.4", features = ["serde"] }
host-api = { path = "../../crates/host-api" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
