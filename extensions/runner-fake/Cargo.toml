[package]
name = "dar-runner-fake"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Fake runner extension for testing: echoes the agent prompt"
rust-version = "1.83"

[lib]
name = "runner_fake"

[dependencies]
anyhow = "1"
cap-runner = { package = "dar-cap-runner", path = "../../crates/cap-runner", version = "0.2" }
host-api = { package = "dar-host-api", path = "../../crates/host-api", version = "0.2" }
runner-core = { package = "dar-runner-core", path = "../../crates/runner-core", version = "0.2" }

[dev-dependencies]
chrono = { version = "0.4", features = ["serde"] }
