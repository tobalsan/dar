[package]
name = "dar-chat-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Opt-in streaming web chat dashboard extension"
rust-version = "1.83"
publish = false

[lib]
name = "chat_web"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
cap-dashboard-tab = { package = "dar-cap-dashboard-tab", path = "../../crates/cap-dashboard-tab", version = "0.3" }
cap-chat = { package = "dar-cap-chat", path = "../../crates/cap-chat", version = "0.3" }
dar-extension-sdk = { path = "../../crates/extension-sdk", version = "0.3" }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
host-api = { package = "dar-host-api", path = "../../crates/host-api", version = "0.3" }
orchestrator-api = { package = "dar-orchestrator-api", path = "../../crates/orchestrator-api", version = "0.3" }
tokio = { version = "1.43", features = ["rt", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }

http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1.43", features = ["macros", "rt"] }
