<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Web preview</title>
<style>
html,body{margin:0;font:14px/1.5 system-ui,sans-serif;color:#202124}main{padding:12px}nav{display:flex;align-items:center;gap:8px;margin-bottom:12px}nav span{flex:1;overflow-wrap:anywhere;min-width:0}button{padding:5px 10px;cursor:pointer}iframe{display:block;border:0;width:100%;height:600px}body.fullscreen{height:100vh}body.fullscreen main{box-sizing:border-box;height:100%;display:flex;flex-direction:column}body.fullscreen iframe{flex:1;min-height:0}#status:empty{display:none}
</style></head><body><p id="status" role="status"></p><main id="content"></main>
<script>
(() => {
  'use strict';
  const content=document.getElementById('content'),status=document.getElementById('status');
  const pending=new Map();
  let next=0;
  const send=message=>parent.postMessage(message,'*');
  const notify=(method,params)=>send({jsonrpc:'2.0',method,params});
  const request=(method,params)=>new Promise((resolve,reject)=>{
    const id=++next,timer=setTimeout(()=>{pending.delete(id);reject(new Error('Preview request timed out'));},30000);
    pending.set(id,{resolve,reject,timer});send({jsonrpc:'2.0',id,method,params});
  });
  const size=()=>notify('ui/notifications/size-changed',{height:Math.ceil(document.body.getBoundingClientRect().height)});
  const context=value=>{document.body.classList.toggle('fullscreen',value?.displayMode==='fullscreen');size();};
  const fail=()=>{content.replaceChildren();status.textContent='Unable to load preview. Text result remains above.';size();};
  const render=result=>{
    try{
      const preview=result.structuredContent,url=new URL(preview.finalUrl);
      if(!['http:','https:'].includes(url.protocol))throw new Error('Invalid preview');
      status.textContent='';content.replaceChildren();
      const toolbar=document.createElement('nav');toolbar.setAttribute('aria-label','Preview controls');
      const address=document.createElement('span');address.textContent=url.href;
      const open=document.createElement('button');open.type='button';open.textContent='Open';
      open.onclick=()=>request('ui/open-link',{url:url.href}).catch(()=>{status.textContent='Unable to open page.';size();});
      if(!preview.frameable){
        const title=document.createElement('h2');title.textContent=preview.title||url.hostname;
        const reason=document.createElement('p');reason.textContent=preview.reason==='unreachable'?'The page did not answer from the agent host.':'This site does not allow display in a frame.';
        content.append(title,address,reason,open);size();return;
      }
      const reload=document.createElement('button');reload.type='button';reload.textContent='Reload';
      const frame=document.createElement('iframe');frame.title=preview.title||url.hostname;
      frame.sandbox='allow-scripts allow-same-origin allow-forms';frame.referrerPolicy='no-referrer';
      reload.onclick=()=>{frame.src=url.href;};
      toolbar.append(address,reload,open);frame.src=url.href;content.append(toolbar,frame);size();
    }catch{fail();}
  };
  addEventListener('message',event=>{
    if(event.source!==parent)return;
    const message=event.data;
    if(!message || message.jsonrpc!=='2.0')return;
    const waiting=pending.get(message.id);
    if(waiting && !message.method){pending.delete(message.id);clearTimeout(waiting.timer);if(message.error)waiting.reject(new Error(message.error.message));else waiting.resolve(message.result);}
    if(message.method==='ui/notifications/tool-result')render(message.params);
    if(message.method==='ui/notifications/host-context-changed')context(message.params);
    if(message.method==='ui/resource-teardown'){
      for(const {timer,reject} of pending.values()){clearTimeout(timer);reject(new Error('View closed'));}pending.clear();
      content.replaceChildren();send({jsonrpc:'2.0',id:message.id,result:{}});
    }
  });
  new ResizeObserver(size).observe(document.body);
  request('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'Dar web preview',version:'1'},appCapabilities:{availableDisplayModes:['inline','fullscreen']}})
    .then(result=>{context(result.hostContext);notify('ui/notifications/initialized',{});}).catch(fail);
})();
</script></body></html>
