<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Artifact viewer</title>
<style>html,body{margin:0;font:14px/1.5 system-ui,sans-serif;color:#202124}main{padding:12px;overflow-wrap:anywhere}iframe{display:block;border:0;width:100%;height:100px}img{display:block;max-width:100%;height:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere}table{border-collapse:collapse}th,td{border:1px solid #ccc;padding:6px 10px}#error{padding:12px;color:#a02020}</style>
</head><body><p id="error" role="status"></p><main id="content"></main>
<script>/*__MARKED__*/</script><script>/*__DOMPURIFY__*/</script>
<script>
(() => {
  'use strict';
  const content=document.getElementById('content'),status=document.getElementById('error');
  const pending=new Map();
  let next=0,generation=0,report;
  const send=message=>parent.postMessage(message,'*');
  const notify=(method,params)=>send({jsonrpc:'2.0',method,params});
  const request=(method,params)=>new Promise((resolve,reject)=>{
    const id=++next;
    const timer=setTimeout(()=>{pending.delete(id);reject(new Error('Artifact request timed out'));},30000);
    pending.set(id,{resolve,reject,timer});send({jsonrpc:'2.0',id,method,params});
  });
  const size=()=>notify('ui/notifications/size-changed',{height:Math.min(10000,Math.ceil(document.body.getBoundingClientRect().height))});
  const open=url=>{
    try{const parsed=new URL(url);if(['http:','https:'].includes(parsed.protocol))request('ui/open-link',{url:parsed.href}).catch(()=>{});}catch{}
  };
  const fail=()=>{report=null;content.replaceChildren();status.textContent='Unable to load artifact. Text result remains above.';size();};
  const reportScript=`<script>(()=>{const height=()=>parent.postMessage({type:'dar-artifact-height',height:document.documentElement.scrollHeight},'*');new ResizeObserver(height).observe(document.documentElement);addEventListener('load',height);document.addEventListener('click',event=>{const link=event.target.closest?.('a[href]');if(!link)return;const href=link.getAttribute('href');event.preventDefault();if(href.startsWith('#')){try{const id=decodeURIComponent(href.slice(1));const target=id?document.getElementById(id)||document.getElementsByName(id)[0]:document.documentElement;target?.scrollIntoView();}catch{}return;}try{const url=new URL(href,document.baseURI);if(['http:','https:'].includes(url.protocol))parent.postMessage({type:'dar-artifact-link',url:url.href},'*');}catch{}},true);})();<\/script>`;
  async function render(result){
    const current=++generation;
    report=null;content.replaceChildren();status.textContent='Loading artifact…';
    try{
      const artifact=result.structuredContent;
      if(typeof artifact?.uri!=='string')throw new Error('Missing artifact');
      const resource=await request('resources/read',{uri:artifact.uri});
      if(current!==generation)return;
      const item=resource.contents?.find(item=>item.uri===artifact.uri);
      if(!item)throw new Error('Missing resource');
      status.textContent='';
      const extension=(artifact.filename||'').split('.').pop().toLowerCase();
      const types={html:'text/html',htm:'text/html',md:'text/markdown',markdown:'text/markdown',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',svg:'image/svg+xml'};
      const code=/^(txt|log|rs|py|js|cjs|mjs|ts|tsx|jsx|json|yaml|yml|toml|css|sh|bash|zsh|sql|go|java|c|h|cpp|hpp|cs|rb|php|swift|xml)$/;
      const mime=(artifact.mediaType||types[extension]||(code.test(extension)?'text/plain':null)||item.mimeType||'application/octet-stream').split(';')[0].trim().toLowerCase();
      if(['image/png','image/jpeg','image/gif','image/webp','image/svg+xml'].includes(mime)){
        const image=document.createElement('img');image.alt=artifact.title||artifact.filename||'Artifact image';
        image.onload=size;image.onerror=()=>{if(current===generation)fail();};
        const data=typeof item.blob==='string'?item.blob:btoa(unescape(encodeURIComponent(item.text)));
        image.src=`data:${mime};base64,${data}`;content.replaceChildren(image);size();return;
      }
      const textType=mime.startsWith('text/')||['application/json','application/javascript','application/xml','application/x-sh','application/toml','application/yaml','application/x-yaml'].includes(mime);
      if(!textType){
        const title=document.createElement('h2');title.textContent=artifact.filename||'Artifact';
        const type=document.createElement('p');type.textContent=mime||'application/octet-stream';
        const bytes=document.createElement('p');bytes.textContent=`${artifact.bytes} bytes`;
        content.replaceChildren(title,type,bytes);size();return;
      }
      const text=typeof item.text==='string'?item.text:new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(atob(item.blob),byte=>byte.charCodeAt(0)));
      if(mime==='text/markdown'){content.innerHTML=DOMPurify.sanitize(marked.parse(text));size();return;}
      if(mime!=='text/html'){const pre=document.createElement('pre');pre.textContent=text;content.replaceChildren(pre);size();return;}
      const frame=document.createElement('iframe');frame.title=artifact.title||artifact.filename||'HTML report';frame.setAttribute('sandbox','allow-scripts');
      report=frame;content.replaceChildren(frame);frame.srcdoc=text+reportScript;
      size();
    }catch{if(current===generation)fail();}
  }
  // Only the host may deliver JSON-RPC. Report messages are handled separately.
  addEventListener('message',event=>{
    if(event.source!==parent)return;
    const message=event.data;
    if(!message || message.jsonrpc!=='2.0')return;
    const waiting=pending.get(message.id);
    if(waiting && !message.method){pending.delete(message.id);clearTimeout(waiting.timer);if(message.error)waiting.reject(new Error(message.error.message));else waiting.resolve(message.result);}
    if(message.method==='ui/notifications/tool-result')render(message.params);
    if(message.method==='ui/resource-teardown'){
      ++generation;for(const {timer,reject} of pending.values()){clearTimeout(timer);reject(new Error('View closed'));}pending.clear();
      send({jsonrpc:'2.0',id:message.id,result:{}});
    }
  });
  addEventListener('message',event=>{
    if(!report || event.source!==report.contentWindow)return;
    const message=event.data;
    if(!message || typeof message!=='object' || Array.isArray(message))return;
    if(message.type==='dar-artifact-height' && Object.keys(message).length===2 && Number.isFinite(message.height) && message.height>=0){report.style.height=`${Math.max(40,Math.min(10000,message.height))}px`;size();}
    else if(message.type==='dar-artifact-link' && Object.keys(message).length===2 && typeof message.url==='string')open(message.url);
  });
  content.addEventListener('click',event=>{const link=event.target.closest?.('a[href]');if(!link)return;const href=link.getAttribute('href');if(href.startsWith('#'))return;event.preventDefault();open(link.href);});
  new ResizeObserver(size).observe(document.body);
  request('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'Dar artifact viewer',version:'1'},appCapabilities:{availableDisplayModes:['inline','fullscreen']}})
    .then(()=>notify('ui/notifications/initialized',{})).catch(fail);
})();
</script></body></html>
