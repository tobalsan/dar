<!doctype html><html><head><meta charset="utf-8"><title>MCP App sandbox</title><style>html,body,iframe{width:100%;height:100%;border:0;margin:0;display:block}body{overflow:hidden}</style></head><body><script>
(() => {
  'use strict';
  const hostOrigin=__HOST_ORIGIN__;
  if (parent===window || location.origin===hostOrigin || !document.referrer || new URL(document.referrer).origin!==hostOrigin) return;
  const inner=document.createElement('iframe');
  inner.title='App content';
  inner.sandbox='allow-scripts allow-forms';
  document.body.append(inner);
  let loaded=false;
  addEventListener('message',event=>{
    const message=event.data;
    if (!message || typeof message!=='object' || message.jsonrpc!=='2.0') return;
    if (event.source===parent && event.origin===hostOrigin) {
      if(message.method==='ui/notifications/sandbox-resource-ready') {
        if(loaded || typeof message.params?.html!=='string') return;
        loaded=true;
        inner.srcdoc=message.params.html;
      } else if (loaded && !message.method?.startsWith('ui/notifications/sandbox-')) {
        inner.contentWindow.postMessage(message,'*');
      }
    } else if(event.source===inner.contentWindow && event.origin==='null' && !message.method?.startsWith('ui/notifications/sandbox-')) {
      parent.postMessage(message,hostOrigin);
    }
  });
  parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/sandbox-proxy-ready',params:{}},hostOrigin);
})();
</script></body></html>
