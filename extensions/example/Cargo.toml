[package]
name = "example"
version = "0.2.0"
edition = "2021"
rust-version = "1.83"

[package.metadata.agentropy]
factory = "example::extension"

[dependencies]
anyhow = "1"
host-api = { path = "../../crates/host-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.43", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
