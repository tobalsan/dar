[package]
name = "example"
version = "0.4.0"
edition = "2021"
rust-version = "1.83"
publish = false

[package.metadata.dar]
factory = "example::extension"

[dependencies]
anyhow = "1"
cap-dashboard-tab = { package = "dar-cap-dashboard-tab", path = "../../crates/cap-dashboard-tab" }
host-api = { package = "dar-host-api", path = "../../crates/host-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.43", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
