id: example-agent
name: "Example Agent"

tracker:
  use: files
  config:
    path: ./issues
  active_states: [todo, in_progress]
  terminal_states: [done, cancelled]

runner:
  use: fake
  max_run_timeout_ms: 3600000
  stall_timeout_ms: 300000
  max_turns: 20

orchestrator:
  poll_interval_ms: 10000
  max_concurrent: 1
  max_retries: 3
  retry_backoff_ms: 30000

workspace:
  root: ./workspaces

# Each agent's dashboard binds an OS-assigned free port on 0.0.0.0 by default,
# so multiple agents never collide. Run `agentropy dash` for one unified view
# over every live agent. Override here to pin a fixed bind/port if needed.
# dashboard:
#   bind: 127.0.0.1
#   port: 7878

# Terminal UI instead of the plain log stream (Chat / Logs / Dash tabs):
foreground: tui

extensions:
  # Toy tool-registry fixture (gated to this example agent). The host MCP bridge
  # resolves this config and threads it into the tool's register() pass, so the
  # `echo_upper` result is suffixed with the value below — proving config/secret
  # parity between the host and the bridge.
  example-tool:
    suffix: " [via-config]"

  # Example of validated, JSON-backed mutation through the host tool registry
  # (a demonstration of ALG-253, NOT the ALG-218 scheduler). The host executes
  # jobs_create / jobs_edit / jobs_list against this generic jobs file instead
  # of the agent editing it ad hoc.
  example-jobs:
    path: ./jobs.json

  # Scheduler extension (ALG-219). Presence of this key opts the agent into the
  # scheduler at build time. It loads cron/jobs.json on boot and fires the
  # default runner on schedule, writing cron/output/<job_id>/<ts>.md.
  # `enabled: false` is a runtime kill switch (still loads, never fires).
  scheduler: {}

# extensions:
#   tui:
#     chat:
#       backend: pi          # optional; default: follow runner.use, then pi
#       command: pi          # optional binary override
#       model: gpt-5         # optional, forwarded to the backend
