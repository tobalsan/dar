id: example-agent
name: "Example Agent"

tracker:
  use: files
  config:
    path: ./issues
  active_states: [todo, in_progress]
  terminal_states: [done, cancelled]

runner:
  use: fake
  max_run_timeout_ms: 3600000
  stall_timeout_ms: 300000
  max_turns: 20

orchestrator:
  poll_interval_ms: 10000
  max_concurrent: 1
  max_retries: 3
  retry_backoff_ms: 30000

workspace:
  root: ./workspaces

dashboard:
  bind: 127.0.0.1
  port: 7878

# Terminal UI instead of the plain log stream (Chat / Logs / Dash tabs):
foreground: tui

# extensions:
#   tui:
#     chat:
#       backend: pi          # optional; default: follow runner.use, then pi
#       command: pi          # optional binary override
#       model: gpt-5         # optional, forwarded to the backend
