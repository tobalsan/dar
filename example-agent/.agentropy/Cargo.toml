[package]
name = "agentropy-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"

[[bin]]
name = "agentropy"
path = "src/main.rs"

[workspace]

[dependencies]
host-api = { path = "../../crates/host-api" }
agentropy-cli = { path = "../../crates/agentropy-cli" }
