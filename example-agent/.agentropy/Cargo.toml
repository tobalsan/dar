frontend-log = { path = "../../extensions/frontend-log", optional = true }
orchestrator = { path = "../../extensions/orchestrator", optional = true }
runner-claude = { path = "../../extensions/runner-claude", optional = true }
tracker-files = { path = "../../extensions/tracker-files", optional = true }
tui = { path = "../../extensions/tui", optional = true }

[features]
default = ["stock-chat-pi", "stock-frontend-log", "stock-orchestrator", "stock-runner-claude", "stock-tracker-files", "stock-tui"]
stock-chat-pi = ["dep:chat-pi"]
stock-frontend-log = ["dep:frontend-log"]
stock-orchestrator = ["dep:orchestrator"]
stock-runner-claude = ["dep:runner-claude"]
stock-tracker-files = ["dep:tracker-files"]
stock-tui = ["dep:tui"]
