name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace
      - name: Test workspace
        run: cargo test --workspace

  # Each workspace member must build and test on its own so a break is
  # localized to one crate. The matrix is generated from cargo metadata so
  # new crates are covered automatically; dar-cli is excluded because it
  # depends on every extension, so the workspace job already covers it.
  members:
    runs-on: ubuntu-latest
    outputs:
      crates: ${{ steps.list.outputs.crates }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "crates=$(cargo metadata --no-deps --format-version 1 | jq -c '[.packages[].name] - ["dar-cli"]')" >> "$GITHUB_OUTPUT"

  crate:
    needs: members
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJson(needs.members.outputs.crates) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.crate }}
      - name: Test ${{ matrix.crate }}
        run: cargo test -p ${{ matrix.crate }}
