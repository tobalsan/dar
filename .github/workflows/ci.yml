name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace
      - name: Test workspace
        run: cargo test --workspace

  # Each workspace member must build and test on its own so a break is
  # localized to one crate (includes extensions/example, the living reference
  # extension kept green in CI).
  crate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - dar-cli
          - dar-host
          - dar-host-api
          - dar-cap-chat
          - dar-cap-runner
          - dar-cap-tracker
          - dar-orchestrator-api
          - dar-runner-core
          - dar-chat-pi
          - dar-dashboard
          - example
          - dar-frontend-log
          - dar-orchestrator
          - dar-system-files
          - dar-system-context
          - dar-runner-cli
          - dar-runner-codex
          - dar-runner-fake
          - dar-runner-pi
          - dar-tracker-files
          - dar-tracker-linear
          - dar-tui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.crate }}
      - name: Test ${{ matrix.crate }}
        run: cargo test -p ${{ matrix.crate }}
