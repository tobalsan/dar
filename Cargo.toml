[workspace]
members = [
    "dist",
    "crates/dar-cli",
    "crates/dar-host",
    "crates/dar-presence",
    "crates/cap-chat",
    "crates/cap-dashboard-tab",
    "crates/cap-tracker",
    "crates/cap-runner",
    "crates/host-api",
    "crates/tool-registry",
    "crates/orchestrator-api",
    "crates/opencode-client",
    "crates/runner-core",
    "crates/extension-sdk",
    "crates/system-files",
    "crates/tool-shim",
    "extensions/chat-opencode",
    "extensions/chat-pi",
    "extensions/chat-codex",
    "extensions/dashboard",
    "extensions/example",
    "extensions/frontend-log",
    "extensions/orchestrator",
    "extensions/runner-cli",
    "extensions/runner-codex",
    "extensions/runner-fake",
    "extensions/runner-opencode",
    "extensions/runner-pi",
    "extensions/scheduler",
    "extensions/system-context",
    "extensions/tool-registry-host",
    "extensions/tracker-files",
    "extensions/tracker-linear",
    "extensions/tui",
    "example-agent/extensions/example-tool",
    "example-agent/extensions/example-jobs",
]
resolver = "2"

[workspace.package]
version = "0.3.1"
license = "MIT"
edition = "2021"
repository = "https://github.com/tobalsan/dar"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
